#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "arcenal"
name = "Hermes Agent"
description."en" = "Self-hosted Hermes assistant with its official dashboard and Gratitude theme"
description."fr" = "Assistant Hermes auto-hébergé avec son dashboard officiel et le thème Gratitude"

version = "0.21.0~ynh64"

maintainers = ["compteonyx"]

[upstream]
license = "MIT"
website = "https://hermes-agent.nousresearch.com"
code = "https://github.com/NousResearch/hermes-agent"

[integration]
yunohost = ">= 12.1.17" # Required by the current helpers 2.1 contract
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false
ldap = false
sso = true
disk = "2G"
ram.build = "1500M"
ram.runtime = "1G"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/arcenal"

[resources]
    [resources.system_user]
    allow_ssh = false
    allow_sftp = false
    home = "/var/www/arcenal"

    [resources.install_dir]
    dir = "/var/www/arcenal/app"

    [resources.data_dir]
    dir = "/var/www/arcenal/data"
    owner = "arcenal:rwx"
    group = "arcenal:rx"

    [resources.permissions]
    main.url = "/"
    main.allowed = "admins"
    main.auth_header = true
    main.protected = true

    [resources.ports]
    main.default = 9119

    [resources.apt]
    packages = ["python3", "python3-venv", "ripgrep", "ffmpeg", "git", "curl", "ca-certificates"]

    [resources.nodejs]
    version = "22.23.1"

    [resources.sources]
        [resources.sources.main]
        url = "https://codeload.github.com/NousResearch/hermes-agent/tar.gz/0aa764feddf00aed631019763ef777d38faf4335"
        format = "tar.gz"
        sha256 = "272c31c21e859394f512aa41bb20a1fa8ca45988fcb12fd3bdc971e3f5990cf8"
