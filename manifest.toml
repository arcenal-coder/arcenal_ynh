#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "arcenal"
name = "ARCenal Agent"
description."en" = "AI supervisor for ARCenal System, based on Hermes Agent by Nous Research"
description."fr" = "Superviseur IA d’ARCenal Système, basé sur Hermes Agent de Nous Research"

version = "0.21.0~ynh27"

maintainers = ["compteonyx"]

[upstream]
license = "MIT"
website = "https://github.com/arcenal-coder/arcenal-agent"
code = "https://github.com/arcenal-coder/arcenal-agent"
cpe = "???" # not applicable — not a packaged CPE software

[integration]
yunohost = ">= 12.1.17" # Required by the current helpers 2.1 contract
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"
disk = "2G"
ram.build = "1500M"
ram.runtime = "1G"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/arcenal"

    [install.admin]
    type = "user"

    [install.provider]
    ask.en = "Choose the default model provider"
    ask.fr = "Choisissez le fournisseur de modèles par défaut"
    type = "select"
    choices = ["nous-portal", "openrouter", "openai", "anthropic", "custom"]
    default = "openrouter"

    [install.api_key]
    ask.en = "API key for the chosen provider (can be left empty and set later in the config panel)"
    ask.fr = "Clé API pour le fournisseur choisi (peut être laissée vide et définie plus tard dans le panneau de configuration)"
    type = "string"
    optional = true
    default = ""

    [install.model]
    ask.en = "Default model (e.g. openrouter/auto)"
    ask.fr = "Modèle par défaut (ex. openrouter/auto)"
    type = "string"
    default = "openrouter/auto"

[resources]
    [resources.system_user]
    allow_ssh = false
    allow_sftp = false
    home = "/var/www/arcenal"

    [resources.install_dir]
    dir = "/var/www/arcenal/app"

    [resources.data_dir]
    dir = "/var/www/arcenal/data"
    owner = "arcenal:rwx"
    group = "arcenal:rx"

    [resources.permissions]
    main.url = "/"
    main.allowed = "admins"
    main.auth_header = true
    main.protected = false
    wiki.url = "/wiki"
    wiki.additional_urls = [
        "/assets",
        "/arcenal-logo.png",
        "/api/plugins/arcenal-supervisor/knowledge/wiki/overview",
        "/api/plugins/arcenal-supervisor/knowledge/wiki/document",
    ]
    wiki.allowed = "all_users"
    wiki.auth_header = true
    wiki.protected = false
    wiki.show_tile = true

    [resources.ports]
    main.default = 9119

    [resources.apt]
    packages = ["python3", "python3-venv", "ripgrep", "ffmpeg", "git", "curl", "ca-certificates"]

    [resources.nodejs]
    version = "22.22"

    [resources.sources]
        [resources.sources.main]
        url = "https://github.com/arcenal-coder/arcenal-agent/archive/refs/tags/v0.21.0-arcenal13.tar.gz"
        sha256 = "2868b5cca45cfb44aaa927b8f836448323e9be73d2ca7cac0c627997d6f142f5"
