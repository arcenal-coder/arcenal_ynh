#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "arcenal"
name = "ARCenal Agent"
description."en" = "Self-hosted AI assistant based on Hermes with a native YunoHost dashboard"
description."fr" = "Assistant IA basé sur Hermes avec dashboard natif YunoHost et thème Gratitude"

version = "0.22.2~ynh4"

maintainers = ["compteonyx"]

[upstream]
license = "MIT"
website = "https://hermes-agent.nousresearch.com"
code = "https://github.com/NousResearch/hermes-agent"

[integration]
yunohost = ">= 12.1.17" # Required by the current helpers 2.1 contract
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false
ldap = false
sso = true
disk = "2G"
ram.build = "1500M"
ram.runtime = "1G"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/arcenal"

[resources]
    [resources.system_user]
    allow_ssh = false
    allow_sftp = false
    home = "/var/www/arcenal"

    [resources.install_dir]
    dir = "/var/www/arcenal/app"

    [resources.data_dir]
    dir = "/var/www/arcenal/data"
    owner = "arcenal:rwx"
    group = "arcenal:rx"

    [resources.permissions]
    main.url = "/"
    main.allowed = "admins"
    main.auth_header = true
    main.protected = true
    assistance.url = "/assistance/"
    assistance.allowed = "all_users"
    assistance.auth_header = true
    assistance.show_tile = false
    assistance.protected = true
    assistance_service.url = "/assistance/service"
    assistance_service.allowed = "visitors"
    assistance_service.auth_header = false
    assistance_service.show_tile = false
    assistance_service.protected = true

    [resources.ports]
    main.default = 9119

    [resources.apt]
    packages = ["python3", "python3-venv", "ripgrep", "ffmpeg", "git", "curl", "ca-certificates"]

    [resources.nodejs]
    version = "22.23.1"

    [resources.sources]
        [resources.sources.main]
        url = "https://codeload.github.com/NousResearch/hermes-agent/tar.gz/d923a5eb487a17c0a68801bba9ef0f56c81040a8"
        format = "tar.gz"
        sha256 = "616649f8ac7e3bb186999d000d77511e733b3930bd2b5921be4a85673320ef8b"

        # Même distribution CPython que pm/lock.json dans la source Hermes.
        [resources.sources.python]
        format = "tar.gz"
        amd64.url = "https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.14.7+20260901-x86_64-unknown-linux-gnu-install_only.tar.gz"
        amd64.sha256 = "0ab3305457051cd3e7c031857e005f1bda17c218a1990567dacaaac6dd1d14f0"
        arm64.url = "https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.14.7+20260901-aarch64-unknown-linux-gnu-install_only.tar.gz"
        arm64.sha256 = "30f1cc489be654477d895b441e196bb080738bf0456da82080ad4ab66a22d80f"
