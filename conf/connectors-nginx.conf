# Origine distincte : aucun script ou endpoint Hermes n'est servi sur ce port.
server {
  listen __PORT_CONNECTORS__ ssl;
  listen [::]:__PORT_CONNECTORS__ ssl;
  server_name __DOMAIN__;
  include /etc/nginx/conf.d/security.conf.inc;
  ssl_certificate /etc/yunohost/certs/__DOMAIN__/crt.pem;
  ssl_certificate_key /etc/yunohost/certs/__DOMAIN__/key.pem;
  access_by_lua_file /usr/share/ssowat/access.lua;
  access_log off;
  error_log /var/log/nginx/arcenal-connectors-error.log warn;

  # Même préfixe de permission SSOwat que l'application ; pas d'URL publique.
  location __CONNECTORS_PATH__/api/arcenal-connectors/ {
    rewrite ^__CONNECTORS_PATH__/api/arcenal-connectors/(.*)$ /$1 break;
    proxy_pass http://unix:/run/arcenal-connectors/admin.sock;
    proxy_set_header X-ARCenal-User $http_ynh_user;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Host localhost;
    proxy_read_timeout 310s;
    client_max_body_size 32k;
  }
  location __CONNECTORS_PATH__/ {
    rewrite ^__CONNECTORS_PATH__/(.*)$ /$1 break;
    proxy_pass http://unix:/run/arcenal-connectors/admin.sock;
    proxy_set_header X-ARCenal-User $http_ynh_user;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Host localhost;
  }
  location / { return 404; }
}
