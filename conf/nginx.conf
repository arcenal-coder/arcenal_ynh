# Proxy inverse Nginx vers l'interface ARCenal Agent.

location __PATH__/ {

  # Prise en charge des WebSockets utilisés par les événements de l'agent.
  proxy_pass http://127.0.0.1:__PORT__/;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Prefix __PATH__;

  # Autorise les tâches longues de l'agent.
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  client_max_body_size 50m;
}
