# Proxy inverse Nginx vers le dashboard officiel Hermes.

location = __PATH__/assistance/service {
  proxy_pass http://127.0.0.1:__PORT__/assistance/service;
  proxy_set_header Host 127.0.0.1:__PORT__;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header Cookie "";
  proxy_set_header Remote-User "";
  proxy_set_header X-ARCenal-Proxy "";
  client_max_body_size 4k;
  access_log off;
}

location __PATH__/assistance/ {
  proxy_pass http://127.0.0.1:__PORT__/assistance/;
  proxy_set_header Host 127.0.0.1:__PORT__;
  proxy_set_header Cookie "";
  proxy_set_header Authorization "";
  proxy_set_header Remote-User $http_ynh_user;
  proxy_set_header X-ARCenal-Proxy "__ASSISTANCE_PROXY_KEY__";
  client_max_body_size 2k;
  access_log off;
}

location __PATH__/ {

  # Prise en charge des WebSockets utilisés par les événements de l'agent.
  proxy_pass http://127.0.0.1:__PORT__/;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  # YunoHost assure l'authentification externe ; Hermes reste lié à la boucle locale.
  proxy_set_header Host 127.0.0.1:__PORT__;
  proxy_set_header Origin http://127.0.0.1:__PORT__;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Prefix __PATH__;
  # Le runtime Hermes n'est pas l'autorité SSO : ne pas lui divulguer la session
  # humaine qui permet d'ouvrir la console centrale sur l'autre origine.
  # Son authentification native conserve X-Hermes-Session-Token / ticket WS.
  proxy_set_header Cookie "";
  proxy_set_header Authorization "";
  proxy_set_header YNH_USER "";
  proxy_set_header YNH_USER_EMAIL "";
  proxy_set_header YNH_USER_FULLNAME "";
  # Ne pas mettre en tampon les réponses diffusées progressivement (SSE).
  proxy_buffering off;

  # Autorise les tâches longues de l'agent.
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  client_max_body_size 50m;
}
